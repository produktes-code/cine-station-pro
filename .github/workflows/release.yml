name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies & Package Backend
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --name cinestation_backend --onefile --hidden-import uvicorn --hidden-import fastapi --hidden-import celery.fixups --hidden-import celery.fixups.django app/main.py
        
      - name: Prepare Backend Binary
        run: |
          mkdir -p backend/dist
          if [ "$RUNNER_OS" == "Windows" ]; then
            chmod +x backend/dist/cinestation_backend.exe || true
          else
            chmod +x backend/dist/cinestation_backend || true
          fi
        shell: bash
        
      - name: Install Node Dependencies
        run: npm install

      - name: Build Electron App
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            npm run pack:win
          else
            npm run pack:mac
          fi
        shell: bash
        env:
          PUBLISH: never

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist-electron/*.dmg
            dist-electron/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
