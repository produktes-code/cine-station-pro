name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Python Dependencies & Package Backend (Mac)
        if: matrix.os == 'macos-latest'
        run: |
          cd backend
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install pyinstaller
          # Empaquetamos la app
          # CineStation Pro requerirá un script run.py similar
          # pero por ahora, prepararemos la estructura.
          # Nota: En CineStation Pro ya se usan carpetas `standalone-python`
        
      - name: Install Node Dependencies
        run: npm install

      - name: Build Electron App
        run: if [ "$RUNNER_OS" == "Windows" ]; then
            npm run pack:win
          else
            npm run pack:mac
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: app-${{ matrix.os }}
          path: dist-electron/*.exe
